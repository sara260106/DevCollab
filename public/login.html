<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — DevCollab ✦</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="container">
        <a href="/" class="logo">
            DevCollab
            <span class="logo-star">✦</span>
        </a>
        <nav class="nav">
            <a href="/browse.html">Browse</a>
            <a href="/login.html" style="color: var(--pastel-pink-dark);">Log in</a>
            <a href="/signup.html" class="btn btn-primary">Sign up ✨</a>
        </nav>
    </div>
</header>

<main>
    <div class="form-container">
        <h2>Welcome back ✦</h2>
        <p class="form-subhead">Good to see you again, builder.</p>
        
        <div id="alert" style="display: none;"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">✨ Log in ✨</button>
        </form>
        
        <p style="margin-top: 28px; text-align: center; color: var(--text-light);">
            New here? <a href="/signup.html" style="color: var(--pastel-pink-dark); text-decoration: none; font-weight: 600;">Create an account</a>
        </p>
        
        <p style="margin-top: 20px; text-align: center; font-size: 12px; color: var(--text-light);">
            ✦ No account? No problem. It takes 30 seconds ✦
        </p>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>✦ Find your coding people. Build something wonderful. ✦</p>
    </div>
</footer>

<script>
    const form = document.getElementById('loginForm');
    const alertDiv = document.getElementById('alert');
    
    // Check if already logged in
    const token = localStorage.getItem('token');
    if (token) {
        window.location.href = '/dashboard.html';
    }
    
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        // Hide previous alert
        alertDiv.style.display = 'none';
        
        // Basic validation
        if (!email || !password) {
            showAlert('Please fill in all fields', 'error');
            return;
        }
        
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Save token and user data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Show success message
                showAlert('✨ Login successful! Redirecting...', 'success');
                
                // Redirect to dashboard after a short delay
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
            } else {
                showAlert(data.error || 'Login failed. Check your email and password.', 'error');
            }
        } catch (error) {
            console.error('Login error:', error);
            showAlert('Something went wrong. Is the server running?', 'error');
        }
    });
    
    function showAlert(message, type) {
        alertDiv.style.display = 'block';
        alertDiv.className = `alert alert-${type === 'error' ? 'error' : 'success'}`;
        alertDiv.textContent = message;
        
        // Auto-hide after 4 seconds
        setTimeout(() => {
            if (alertDiv.style.display === 'block') {
                alertDiv.style.display = 'none';
            }
        }, 4000);
    }
</script>

</body>
</html>
