<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — DevCollab ✦</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <div class="container">
        <a href="/" class="logo">DevCollab<span class="logo-star">✦</span></a>
        <nav class="nav">
            <a href="/browse.html">Browse</a>
            <a href="/dashboard.html" id="dashboardLink">Dashboard</a>
            <a href="/login.html" id="authLink" class="btn btn-outline">Log in</a>
        </nav>
    </div>
</header>

<main>
    <div class="container" id="projectContainer">
        <div style="text-align: center; padding: 60px 0;">
            <p>☁️ Loading project details...</p>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>✦ Find your people. Build together. ✦</p>
    </div>
</footer>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    // Update nav
    const dashboardLink = document.getElementById('dashboardLink');
    const authLink = document.getElementById('authLink');
    
    if (token && user.id) {
        if (dashboardLink) dashboardLink.style.display = 'inline-block';
        if (authLink) {
            authLink.textContent = 'Log out';
            authLink.href = '#';
            authLink.onclick = (e) => {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/';
            };
        }
    } else {
        if (dashboardLink) dashboardLink.style.display = 'none';
        if (authLink) {
            authLink.textContent = 'Log in';
            authLink.href = '/login.html';
        }
    }

    async function loadProject() {
        const container = document.getElementById('projectContainer');
        
        try {
            const response = await fetch(`/api/projects/${projectId}`);
            const project = await response.json();
            
            if (response.ok) {
                const isOwner = token && project.owner_id === user.id;
                
                container.innerHTML = `
                    <div style="max-width: 800px; margin: 40px auto;">
                        <a href="/browse.html" style="color: var(--text-light); text-decoration: none; display: inline-block; margin-bottom: 24px;">← Back to browse</a>
                        
                        <div style="background: white; border-radius: 40px; padding: 48px; box-shadow: var(--shadow-md); border: 1px solid var(--border-soft);">
                            <div style="display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 16px;">
                                <h1 style="font-size: 42px; font-family: 'DM Serif Display', serif;">${escapeHtml(project.title)}</h1>
                                <span class="tag" style="background: ${project.status === 'open' ? 'var(--pastel-green)' : 'var(--pastel-yellow)'}; font-size: 14px;">${project.status}</span>
                            </div>
                            
                            <div class="tech-tags" style="margin: 24px 0;">
                                ${project.skills?.map(skill => `<span class="tag">#${escapeHtml(skill)}</span>`).join('') || '<span class="tag">#coding</span>'}
                            </div>
                            
                            <div style="background: var(--cream); padding: 20px; border-radius: 24px; margin: 24px 0;">
                                <p style="font-size: 14px; color: var(--text-soft); margin-bottom: 8px;">Posted by</p>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div style="width: 48px; height: 48px; background: var(--pastel-pink); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>
                                    <div>
                                        <strong>${escapeHtml(project.owner_name)}</strong>
                                        <p style="font-size: 12px; color: var(--text-light); margin-top: 4px;">Project owner</p>
                                    </div>
                                </div>
                            </div>
                            
                            <h3 style="margin: 32px 0 16px;">📖 About this project</h3>
                            <p style="line-height: 1.7; color: var(--text-soft);">${escapeHtml(project.description)}</p>
                            
                            <div style="margin: 32px 0; padding: 20px; background: var(--pastel-yellow); border-radius: 24px;">
                                <span>👥 Looking for <strong>${project.collaborators_needed}</strong> collaborator${project.collaborators_needed > 1 ? 's' : ''}</span>
                            </div>
                            
                            <div id="actionArea">
                                ${renderActionButtons(project, isOwner)}
                            </div>
                        </div>
                    </div>
                `;
                
                // Attach event listeners
                if (!isOwner && token) {
                    const requestBtn = document.getElementById('requestJoinBtn');
                    if (requestBtn) {
                        requestBtn.addEventListener('click', () => sendJoinRequest(project.id));
                    }
                }
                
                if (isOwner) {
                    const deleteBtn = document.getElementById('deleteProjectBtn');
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', () => deleteProject(project.id));
                    }
                }
            } else {
                container.innerHTML = `
                    <div class="empty-state" style="margin: 60px auto; max-width: 500px;">
                        <p>☁️ Project not found</p>
                        <a href="/browse.html" class="btn btn-primary" style="margin-top: 20px;">Browse projects</a>
                    </div>
                `;
            }
        } catch (error) {
            container.innerHTML = `
                <div class="empty-state" style="margin: 60px auto; max-width: 500px;">
                    <p>☁️ Something went wrong</p>
                </div>
            `;
        }
    }
    
    function renderActionButtons(project, isOwner) {
        if (isOwner) {
            return `
                <div style="display: flex; gap: 16px; justify-content: center;">
                    <button id="deleteProjectBtn" class="btn btn-outline" style="border-color: #ffcece; color: #b55a5a;">🗑️ Delete project</button>
                </div>
            `;
        }
        
        if (!token) {
            return `
                <div style="text-align: center;">
                    <p style="color: var(--text-light); margin-bottom: 16px;">✨ Want to join this project?</p>
                    <a href="/login.html" class="btn btn-primary">Log in to request</a>
                </div>
            `;
        }
        
        if (project.status !== 'open') {
            return `
                <div style="text-align: center;">
                    <p class="alert alert-info">This project is ${project.status}. Check back later!</p>
                </div>
            `;
        }
        
        return `
            <div style="text-align: center;">
                <button id="requestJoinBtn" class="btn btn-primary" style="padding: 14px 32px;">🤝 Request to join this project</button>
            </div>
        `;
    }
    
    async function sendJoinRequest(projectId) {
        try {
            const response = await fetch('/api/requests', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ project_id: projectId, message: 'I\'d love to collaborate on this!' })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                const actionArea = document.getElementById('actionArea');
                if (actionArea) {
                    actionArea.innerHTML = `
                        <div class="alert alert-success" style="text-align: center;">
                            ✨ Request sent! The project owner will review it.
                        </div>
                    `;
                }
            } else {
                alert(data.error || 'Failed to send request');
            }
        } catch (error) {
            alert('Something went wrong');
        }
    }
    
    async function deleteProject(projectId) {
        if (!confirm('Are you sure you want to delete this project? This cannot be undone.')) {
            return;
        }
        
        try {
            const response = await fetch(`/api/projects/${projectId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (response.ok) {
                window.location.href = '/dashboard.html';
            } else {
                alert('Failed to delete project');
            }
        } catch (error) {
            alert('Something went wrong');
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    if (projectId) {
        loadProject();
    } else {
        window.location.href = '/browse.html';
    }
</script>

</body>
</html>
